services:
  - type: web
    name: analise-exploratoria-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PUBLIC_BASE_URL
        value: https://analise-exploratoria-backend.onrender.com
    healthCheckPath: /health
